# Minimal read-only access to root-generated, root:zabbix 0640 metrics
UserParameter=netbox.audit.status,/usr/bin/python3 /usr/local/libexec/netbox-zabbix-bridge.py read status
UserParameter=netbox.audit.differences,/usr/bin/python3 /usr/local/libexec/netbox-zabbix-bridge.py read differences
UserParameter=netbox.audit.timestamp,/usr/bin/python3 /usr/local/libexec/netbox-zabbix-bridge.py read timestamp
